<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In or Register — AgroLink Ebonyi</title>
<meta name="description" content="Farmers and buyers can create an account on AgroLink Ebonyi to list produce and place orders." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">AgroLink <span>Ebonyi</span></a>
    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Open menu">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="prices.html">Market Prices</a>
      <a href="weather.html">Weather</a>
      <a href="directory.html">Directory</a>
      <a href="contact.html">Contact</a>
      <a href="list-produce.html" class="btn-nav">List Your Produce</a>
    </div>
  </div>
</nav>

<header class="page-header">
  <div class="container">
    <h1>Sign In or Register</h1>
    <p>Farmers list produce. Buyers place orders. One free account for both.</p>
  </div>
</header>

<section>
  <div class="container" style="max-width:820px">
    <p id="authMessage" class="small"></p>

    <div class="grid grid-2">
      <form class="card" style="padding:22px" onsubmit="handleRegister(event)">
        <h3>Create an account</h3>
        <div class="form-field"><label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required minlength="3" /></div>
        <div class="form-field"><label for="rphone">Phone Number</label>
          <input type="tel" id="rphone" name="phone" required pattern="[0-9+ ]{7,15}" /></div>
        <div class="form-field"><label for="role">I am a</label>
          <select id="role" name="role" required>
            <option value="farmer">Farmer</option>
            <option value="buyer">Buyer</option>
          </select></div>
        <div class="form-field"><label for="remail">Email</label>
          <input type="email" id="remail" name="email" required /></div>
        <div class="form-field"><label for="rpassword">Password</label>
          <input type="password" id="rpassword" name="password" required minlength="6" /></div>
        <p style="margin-top:14px"><button type="submit" class="btn btn-primary">Register</button></p>
      </form>

      <form class="card" style="padding:22px" onsubmit="handleLogin(event)">
        <h3>Log in</h3>
        <div class="form-field"><label for="lemail">Email</label>
          <input type="email" id="lemail" name="email" required /></div>
        <div class="form-field"><label for="lpassword">Password</label>
          <input type="password" id="lpassword" name="password" required /></div>
        <p style="margin-top:14px"><button type="submit" class="btn btn-primary">Log In</button></p>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© 2026 AgroLink Ebonyi</div>
  </div>
</footer>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="agrolink.js"></script>
</body>
</html>
